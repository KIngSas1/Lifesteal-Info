name: Build mod

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Unzip and build every zip in the repo
        run: |
          mkdir -p dist
          for z in *.zip; do
            n="${z%.zip}"
            mkdir -p "work/$n"
            unzip -q -o "$z" -d "work/$n"
            (cd "work/$n" && gradle build --no-daemon)
            for f in work/$n/build/libs/*.jar; do
              case "$f" in *-sources.jar) ;; *) cp "$f" dist/ ;; esac
            done
          done
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: mod-jars
          path: dist/*.jar
          if-no-files-found: error
